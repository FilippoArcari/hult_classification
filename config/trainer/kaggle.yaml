accelerator: gpu
devices: 1
precision: 16-mixed
max_epochs: 1000
max_time: "00:08:00:00"   # safety net: ferma il training prima del timeout di sessione
accumulate_grad_batches: 2
gradient_clip_val: 1.0
benchmark: true
deterministic: false
log_every_n_steps: 20
enable_checkpointing: true
default_root_dir: /kaggle/working