    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "pillow>=11",
    "python-multipart>=0.0.20",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "torchmetrics>=1.9,<2",
    "tensorboard>=2.18",
    "uvicorn>=0.34",
    "wandb>=0.28.1",
